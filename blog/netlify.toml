# Netlify site for blog.sejaconte.com.br. Base directory: blog/ (set on the Netlify site).
[build]
  command = "npm run check && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old Automarticles URLs that have no direct equivalent.
[[redirects]]
  from = "/feed"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Automarticles paginated with ?page=N.
[[redirects]]
  from = "/"
  query = {page = ":p"}
  to = "/pagina/:p"
  status = 301
  force = true

[[redirects]]
  from = "/search"
  to = "/"
  status = 301

# Posts merged into their canonical during the 2026-10-27 content review (cannibalization).
