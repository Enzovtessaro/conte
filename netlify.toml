[build]
  command = "npm run build"
  publish = "dist"

# The old /blog route on the landing page moved to the blog subdomain.
[[redirects]]
  from = "/blog"
  to = "https://blog.sejaconte.com.br/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://blog.sejaconte.com.br/post/:splat"
  status = 301
  force = true

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
